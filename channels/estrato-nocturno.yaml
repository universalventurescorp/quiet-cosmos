# Estrato Nocturno — documentales para dormir en español (red Estrato).
# Solo cambia lo que difiere de config.yaml; todo lo demás se hereda de Quiet Cosmos.
channel:
  name: "Estrato Nocturno"
  language: es
  wordmark: "ESTRATO NOCTURNO"
  mark: none               # el logo de la luna es de Quiet Cosmos; Estrato tendrá su propio icono
  about: >-
    a Spanish-language YouTube channel of calm, long-form space documentaries to relax and fall asleep to
    (planets, moons, the Sun, stars, nebulae, galaxies, black holes, and our own planet seen from space).
    Audience: Latin America and Spain; prefer the subjects with the strongest search demand in Spanish
  narrator_style: >-
    The narrator is a wise, warm storyteller with a deep voice who has spent a lifetime looking at the sky,
    speaking intimately to ONE listener (in Spanish address them as "tú", never "ustedes"). Tell the science as
    a story, not a lecture: set a scene, let a small mystery appear, let the discovery unfold step by step
    (who looked, what they saw, why it mattered), then pause on its meaning and on the listener's place in it.
    Use rhythm: an occasional very short sentence for emphasis, a gentle rhetorical question, a quiet moment of
    awe. Each chapter is a chapter of one story, with a small tension that resolves. Concrete sensory images
    (what you would see, hear, feel if you were there). Warm, never pompous, never hype, no exclamations:
    the listener is drifting off to sleep. Natural neutral Latin American Spanish; avoid Spain-only words.
  # Suscriptores (26-oct-2026): la gente se duerme y no se suscribe (maratón: +1 sub en 252 vistas).
  # Una sola frase tranquila al final del cold open, cuando el oyente todavía está despierto.
  # 7-nov-2026: la frase (y su QR) iba en el minuto 1 y la mitad de la gente se iba antes del minuto 2 -> minuto ~12
  subscribe_minute: 12
  subscribe_line: "Si este viaje te ayuda a descansar, suscríbete ahora, antes de cerrar los ojos. Así, la próxima noche, seguimos viajando juntos."

# 1-nov-2026 (Luis): marca fija en TODAS las miniaturas = estilo que ganó el Test & Compare del maratón
# ("DUERME EN MINUTOS", ~44 %). Las camas con ventana dieron 0,8 % de clics. pipeline/thumbnail.py make_duerme.
thumbnail:
  style: duerme
  word: "DUERME"
  line2: "EN MINUTOS"        # 13-nov-2026 (Luis): formato C fijo. Subtítulo siempre igual; el tema NO va en la imagen
  label_first: true          # título: "3 horas para dormir: <tema>"
  outline_rule: >-
    thumbnail_texts: always exactly ["EN MINUTOS", "EN MINUTOS", "EN MINUTOS"] (fixed channel format, never the topic).
    Also add the key "thumbnail_subjects": three short English descriptions (max 25 words each) of the SAME single
    striking astronomical object, the episode's main subject (three slightly different views of it, so the best render
    can be chosen), e.g. "Saturn with its golden rings, seen from its night side as a crescent", "a supermassive black
    hole with a thin glowing orange accretion disk". One object only, big and always seen WHOLE from far
    away in deep space (a full sphere, a crescent, a ring or a nebula), never a surface, horizon or view from orbit
    (e.g. not "Earth seen from the ISS" but "planet Earth seen whole from deep space"). No landscapes, no people,
    no spacecraft.
  hero_images: true          # 2-nov-2026: la GPU pinta 2 imágenes por miniatura con la receta ganadora

# 29-oct-2026 (Luis): "que me sienta acompañado". El narrador nunca dice "escanea": la mayoría ve en el celular;
# los QR son para la TV (35 % de las horas, 44 min de promedio) y la computadora. Cada ~12 min de narración el narrador deja la historia un momento
# y le habla al oyente (más suave, con pausa antes y después). Una sola vez, el "regalo": QR de luna que abre WhatsApp
# con un mensaje listo para compartir el canal. QR de suscripción mientras se pide suscribirse en la apertura.
companion:
  enabled: true
  every_minutes: 12
  first_minute: 6
  pause: 0.8               # silencio extra antes y después de cada momento de compañía (s)
  soft_db: -4              # la voz baja 4 dB en esos momentos (después de la compresión)
  gift_minute: 20
  gift_line: "Y si conoces a alguien que también pasa noches largas, compártele este viaje."
  qr:
    seconds: 22
    subscribe_url: "https://estratonocturno.pages.dev/s"   # web/s.html: un solo botón "Suscribirme"
    subscribe_label: "Suscríbete desde tu celular"
    gift_page: "https://estratonocturno.pages.dev"   # web/r.html en Cloudflare Pages (29-oct)
    gift_text: "Para tus noches largas, te regalo esto: https://youtube.com/@EstratoNocturno"
    gift_label: "Regala una noche tranquila"

voice:
  # Narrador del canal (elegido el 16-oct-2026 tras 4 rondas de pruebas): voz diseñada con Qwen3-TTS
  # (Apache-2.0) y clonada frase por frase en la GPU de Kaggle a partir de este clip de referencia.
  engine: qwen
  # 1-nov-2026 (Luis): SIN respaldo. Si Kaggle falla o falta una sola frase, la corrida se detiene (no Kokoro).
  require_gpu: true
  model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
  ref_audio: assets/voices/estrato_narrador.mp3
  ref_text: "Esta noche viajaremos despacio, sin ninguna prisa, hacia el planeta más grande de nuestro sistema solar, mientras todo a nuestro alrededor se queda en calma."
  # Por párrafos (18-oct-2026): 2-3 frases por generación, y los puntos internos se leen como "..." para que la voz
  # no cierre cada frase como si fuera la última (el efecto "rectángulo"). Medido contra Planeta Antiguo: habla más
  # seguido (pausas ~0,5 s), menos caída al final de frase, acento más limpio. Volver a "sentence" = frase por frase.
  unit: paragraph
  inner_end: "..."
  quiet_breaths: true      # baja ~24 dB las tomas de aire en las pausas (la compresión fuerte las hacía sonar)
  fallback_id: em_alex     # Kokoro, si la GPU falla
  id: em_alex
  speed: 0.8
  wpm: 118                 # ~141 ppm al hablar, menos las pausas
  # 25-oct-2026: ritmo medido en Calm Space (@CalmSpaceToSleep): pausas cortas y regulares (mediana 0,54 s,
  # nunca más de 1,2 s), sin silencios largos entre párrafos.
  pause_sentence: 0.6
  pause_paragraph: 1.1
  pause_reveal: 0.3

mix:
  music_volume: 0.06       # 25-oct: música casi inaudible bajo la voz, como Calm Space (~35 dB por debajo)
  voice_eq: documentary_max  # la "E" que eligió Luis (cálida, sin reverb) + compresión fuerte para el volumen máximo
  lufs: -16                # 25-oct: volumen de canal para dormir, como Calm Space (antes -10.5)
  # 29-oct: Luis eligió la voz A (tono natural ~101 Hz, sin subir). Fin de la prueba A/B.
  score: chapters          # la música cambia de tonalidad y color en cada capítulo

shorts:
  count: 3                 # 25-oct: 3 Shorts por episodio (9/semana) para ganar suscriptores más rápido
  gpu_voice_tempo: 1.1     # los Shorts van un poco más rápidos que el episodio
  # 26-oct-2026: los Shorts traen casi todas las vistas, pero casi nadie se suscribe. Cierre fijo de seguimiento
  # (Claude ya no escribe su propia invitación al final). Video relacionado del Short = maratón (lo pone Luis).
  closing_line: "Sígueme: cada semana, un viaje nuevo para dormir."

kaggle:
  gpu_budget_minutes: 170  # narración (ambas GPU) + escenas IA
  wait_minutes: 260


upload:
  token_env: YT_REFRESH_TOKEN_NOCTURNO   # secreto de GitHub con el permiso de subida de ESTE canal

# 30-oct-2026 (Luis): solo viajes largos. Lunes y jueves 3 h; sábado toda la noche (8 h, termina con "Buenos días").
# Se producen por etapas (pipeline/longform.py, workflow largo.yml): las escenas IA nuevas van sobre todo en la
# primera hora; después más NASA, y cada capítulo un poco más lento y suave (pausas hasta x slow_to).
long:
  muestra:                 # prueba corta de toda la maquinaria (3 partes), sube privada como MUESTRA
    minutes: 30
    parts: 3
    max_images: 40
    full_minutes: 10
    gpu_budget_minutes: 70
    wait_minutes: 180
    slow_to: 1.3
    sample: true
    title_label: "3 horas para dormir"
    topics:
      - "Un viaje lento entre los anillos de Saturno y sus lunas heladas"
  3h:
    minutes: 180
    # 2-nov-2026 (Luis): NUNCA menos de 3 h. Se apunta a 3 h 20 (margen) y por debajo de 3 h 02 la narración
    # alarga sus pausas o sostiene el cierre tranquilo (pipeline/voice.synthesize). 5 máquinas pintan ~42 min c/u.
    aim_minutes: 200
    stretch: 1.68          # x(200/180) = 1,87 total. 4-nov: x1,75 dio 3:07:24 (ratio 0,595) -> se sube
    min_minutes: 182
    parts: 5
    max_images: 170
    full_minutes: 60
    gpu_budget_minutes: 210
    wait_minutes: 340
    slow_to: 1.5
    title_label: "3 horas para dormir"
    topics:                # el canal ya contó todos los planetas: primero lo que aún no se contó
      - "La vida de las estrellas: cómo nacen, brillan y se apagan"
      - "Los grandes misterios del universo: agujeros negros, materia oscura y energía oscura"
      - "La Tierra vista desde el espacio: océanos, auroras, tormentas y las luces de la noche"
      - "Mundos alrededor de otras estrellas: los exoplanetas y la búsqueda de otra Tierra"
      - "El Sol: la estrella que nos da la vida, desde su corazón hasta sus tormentas"
      - "Un viaje por la Vía Láctea, desde nuestro vecindario de estrellas hasta su centro"
      - "Cometas, asteroides y meteoros: los viajeros del Sistema Solar"
      - "La historia del universo: desde el Big Bang hasta esta noche"
  8h:
    minutes: 480
    # 7-nov-2026: el 1.er intento (6-nov, x1,45) narró 7 h 48 incluso alargando pausas y cierre -> no se produjo.
    # Igual que el de 3 h: se apunta a 8 h 20 con el mismo estiramiento (x1,75 total) y el cierre puede sostenerse más.
    aim_minutes: 500
    stretch: 1.68
    min_minutes: 482       # nunca menos de 8 h
    max_outro_pad_minutes: 40
    parts: 11
    max_images: 120
    full_minutes: 60
    gpu_budget_minutes: 270
    wait_minutes: 345
    slow_to: 1.8
    title_label: "8 horas · un viaje de toda la noche"
    end_line: "Buenos días."
    final_rule: >-
      This is the final chapter of a journey that lasted the whole night: the listener is waking up. Let the
      dawn arrive slowly (first light over the Earth seen from orbit), bring the listener gently back home, and
      end with a warm, quiet "Buenos días". Do not ask for likes or subscriptions.
    topics:
      - "Un viaje de toda la noche, desde la Tierra hasta el borde del universo observable"
      - "Toda la noche en órbita: una vuelta a la Tierra tras otra, de la noche al amanecer"
      - "Una noche entera viajando entre las galaxias del universo cercano"

# 11-nov-2026 (Luis): volver a la voz del maratón qKVP9yXgbN0 (7,6 K h, 1 h 04 de promedio, 57 % a los 13 min).
# Esos episodios (Mercurio, Venus, Marte, Saturno; 21-25 oct) se hicieron con el commit ebc9eff: pausas largas,
# música más presente y ritmo constante; el maratón solo los dejó a -16 LUFS. QR, compañía y suscripción siguen igual.
# Para volver a los parámetros del 25-oct (Calm Space): voice_preset: calm
voice_preset: maraton
presets:
  maraton:
    voice:
      pause_sentence: 0.8
      pause_paragraph: 1.8
      pause_chapter: 4.0
      pause_reveal: 0.7
    mix:
      music_volume: 0.16
      lufs: -16            # el maratón normalizó cada episodio a -16 LUFS (se mezclaban a -10,5)
    long:
      3h:
        slow_to: 1.0       # ritmo constante, como los episodios del maratón (sin ir frenando en la noche)
        soften: false      # el guion no pide "más lento y más suave" en el 2.º y 3.er tercio
  calm:                    # en pausa: lo que estaba activo del 25-oct al 11-nov
    voice:
      pause_sentence: 0.6
      pause_paragraph: 1.1
      pause_reveal: 0.3
    mix:
      music_volume: 0.06
      lufs: -16
    long:
      3h:
        slow_to: 1.5
        soften: true
