name: produce-episode

on:
  schedule:
    - cron: "17 12 * * 1,3,5"   # lun/mié/vie 07:17 hora de Lima
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema opcional (vacío = siguiente de la cola)"
        required: false
      upload:
        description: "Subir a YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core fonts-roboto

      - name: Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1

      - name: Produce episode
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          UPLOAD: ${{ inputs.upload }}
        run: python -m pipeline.run

      - name: Make a 10-minute preview to watch
        if: always()
        run: |
          for v in outputs/*/video.mp4; do
            [ -f "$v" ] || continue
            ffmpeg -y -loglevel error -i "$v" -t 600 -vf scale=1280:720 \
              -c:v libx264 -preset veryfast -crf 28 -c:a aac -b:a 128k \
              "$(dirname "$v")/preview-10min.mp4"
          done

      - name: Keep preview, script, captions and thumbnail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-files
          path: |
            outputs/**/preview-10min.mp4
            outputs/**/script.json
            outputs/**/metadata.json
            outputs/**/captions.srt
            outputs/**/thumbnail.jpg
          retention-days: 7
          if-no-files-found: ignore

      - name: Save queue state
        if: success()
        run: |
          git config user.name "quiet-cosmos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Episode produced $(date -u +%F)" && git push)
