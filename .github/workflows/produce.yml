name: produce-episode

on:
  schedule:
    - cron: "17 12 * * *"     # todos los días 07:17 hora de Lima
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema opcional (vacío = siguiente de la cola)"
        required: false
      upload:
        description: "Subir a YouTube"
        type: boolean
        default: true
      shorts:
        description: "Producir Shorts"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    # Por defecto, las máquinas gratis de GitHub. Para usar una máquina propia (más rápida),
    # crea la variable de repositorio RUNNER con el valor: self-hosted
    runs-on: ${{ vars.RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          sudo apt-get install -y fonts-inter || echo "fonts-inter not available, using fallback font"

      - name: Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-v1

      - name: Produce episode
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          if [ "${{ inputs.shorts }}" = "false" ]; then
            python -m pipeline.run --no-shorts
          else
            python -m pipeline.run
          fi

      - name: Make a 10-minute preview to watch
        if: always()
        run: |
          for v in outputs/*/video.mp4; do
            [ -f "$v" ] || continue
            ffmpeg -y -loglevel error -i "$v" -t 600 -vf scale=1280:720 \
              -c:v libx264 -preset veryfast -crf 27 -c:a aac -b:a 128k \
              "$(dirname "$v")/preview-10min.mp4"
          done

      - name: Keep preview, Shorts, thumbnails, script and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode-files
          path: |
            outputs/**/preview-10min.mp4
            outputs/**/short.mp4
            outputs/**/thumbnail_*.jpg
            outputs/**/script.json
            outputs/**/metadata.json
            outputs/**/qa.json
            outputs/**/captions.srt
          retention-days: 7
          if-no-files-found: ignore

      - name: Save queue state
        if: always()
        run: |
          git config user.name "quiet-cosmos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Episode produced $(date -u +%F)" && git pull --rebase && git push)
