name: rehacer-miniaturas
# Rehace las 3 miniaturas DUERME de un viaje ya producido y las publica en estratonocturno.pages.dev/miniaturas.
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "Id de la corrida de viaje-largo", required: true }
      video_id: { description: "Id del video en YouTube", required: true }
      title: { description: "Título para la página (vacío = el del guion)", required: false }
permissions:
  contents: write
  actions: read
env:
  CHANNEL: estrato-nocturno
jobs:
  rehacer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: work-listo, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}", path: art }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: |
          pip install -q Pillow numpy pyyaml
          mv art/outputs outputs
          python scripts/rehacer_miniaturas.py "${{ inputs.video_id }}" "${{ inputs.title }}"
          git config user.name "quiet-cosmos-bot"; git config user.email "actions@users.noreply.github.com"
          git add web/miniaturas && git commit -qm "Miniaturas rehechas ${{ inputs.video_id }}" && git pull -q --rebase && git push -q
          mkdir diag && cp -r hero rehechas diag/ && cd diag && git init -q && git checkout -q -b diag-miniaturas && git add . && \
            git -c user.name=bot -c user.email=actions@users.noreply.github.com commit -qm heroes && \
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-miniaturas
